{% extends "base.html" %} {% load static%} {% block title%} HOMEPAGE
{%endblock%} {% block content %}
<section>
  <form action="/submit-heart-data" method="post" class="heart-form">
    {% csrf_token %}
    <h2>Heart Disease Risk Assessment</h2>

    <!-- Age -->
    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age" name="age" class="form-control" required />
    </div>

    <!-- Sex -->
    <div class="form-group">
      <label for="sex">Sex</label>
      <select id="sex" name="sex" class="form-control" required>
        <option value="">Select</option>
        <option value="1">Male</option>
        <option value="0">Female</option>
      </select>
    </div>

    <!-- Chest Pain Type -->
    <div class="form-group">
      <label for="cp">Chest Pain Type</label>
      <select id="cp" name="cp" class="form-control" required>
        <option value="">Select</option>
        <option value="0">Typical Angina</option>
        <option value="1">Atypical Angina</option>
        <option value="2">Non-anginal Pain</option>
        <option value="3">Asymptomatic</option>
      </select>
    </div>

    <!-- Resting Blood Pressure -->
    <div class="form-group">
      <label for="trestbps">Resting Blood Pressure (mmHg)</label>
      <input
        type="number"
        id="trestbps"
        name="trestbps"
        class="form-control"
        required
      />
    </div>

    <!-- Cholesterol -->
    <div class="form-group">
      <label for="chol">Cholesterol (mg/dL)</label>
      <input
        type="number"
        id="chol"
        name="chol"
        class="form-control"
        required
      />
    </div>

    <!-- Fasting Blood Sugar -->
    <div class="form-group">
      <label for="fbs">Fasting Blood Sugar > 120 mg/dL</label>
      <select id="fbs" name="fbs" class="form-control" required>
        <option value="">Select</option>
        <option value="1">True</option>
        <option value="0">False</option>
      </select>
    </div>

    <!-- Resting ECG -->
    <div class="form-group">
      <label for="restecg">Resting ECG Results</label>
      <select id="restecg" name="restecg" class="form-control" required>
        <option value="">Select</option>
        <option value="0">Normal</option>
        <option value="1">ST-T Abnormality</option>
        <option value="2">Left Ventricular Hypertrophy</option>
      </select>
    </div>

    <!-- Maximum Heart Rate -->
    <div class="form-group">
      <label for="thalach">Maximum Heart Rate Achieved</label>
      <input
        type="number"
        id="thalach"
        name="thalach"
        class="form-control"
        required
      />
    </div>

    <!-- Exercise Induced Angina -->
    <div class="form-group">
      <label for="exang">Exercise Induced Angina</label>
      <select id="exang" name="exang" class="form-control" required>
        <option value="">Select</option>
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </div>

    <!-- Oldpeak -->
    <div class="form-group">
      <label for="oldpeak">ST Depression (Oldpeak)</label>
      <input
        type="number"
        step="0.1"
        id="oldpeak"
        name="oldpeak"
        class="form-control"
        required
      />
    </div>

    <!-- Slope -->
    <div class="form-group">
      <label for="slope">Slope of Peak Exercise ST Segment</label>
      <select id="slope" name="slope" class="form-control" required>
        <option value="">Select</option>
        <option value="0">Upsloping</option>
        <option value="1">Flat</option>
        <option value="2">Downsloping</option>
      </select>
    </div>

    <!-- Number of Major Vessels -->
    <div class="form-group">
      <label for="ca">Number of Major Vessels (0–3)</label>
      <input
        type="number"
        id="ca"
        name="ca"
        min="0"
        max="3"
        class="form-control"
        required
      />
    </div>

    <!-- Thalassemia -->
    <div class="form-group">
      <label for="thal">Thalassemia</label>
      <select id="thal" name="thal" class="form-control" required>
        <option value="">Select</option>
        <option value="1">Normal</option>
        <option value="2">Fixed Defect</option>
        <option value="3">Reversible Defect</option>
      </select>
    </div>

    <!-- Submit -->
    <button type="submit" class="btn btn-danger w-100 mt-3">Submit</button>
    <a href="{% url 'result' %}" class="btn-back">View Result</a>
    </div>
  </form>
</section>
{% endblock %}
